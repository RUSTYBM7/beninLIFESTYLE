<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BENIN LIFE — Street Missions</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="mark">BL</span><div><strong>BENIN LIFE</strong><small>GTA-pattern street missions · Benin City</small></div></div>
      <div class="top-meta"><span id="clock">08:00</span> · Day <span id="dayNum">1</span> · <span id="phase">Morning</span></div>
    </header>
    <div class="grid">
      <aside class="side">
        <section class="card">
          <h2>You</h2>
          <div class="stats">
            <div><label>Cash</label><b id="cash">₦25,000</b></div>
            <div><label>Bank</label><b id="bank">₦0</b></div>
            <div><label>Energy</label><b id="energy">100</b></div>
            <div><label>Rep</label><b id="rep">10</b></div>
          </div>
        </section>
        <section class="card">
          <h2>Street missions</h2>
          <div class="mission-list" id="missionList"></div>
        </section>
        <section class="card">
          <h2>Active</h2>
          <p class="mission-title" id="missionTitle">Select a street mission</p>
          <p class="brief" id="missionBrief">Briefing appears here.</p>
          <p class="objective" id="objective">—</p>
          <div class="steps" id="steps"></div>
          <button id="btnAdvanceMission" class="primary" disabled>Complete checkpoint</button>
        </section>
        <section class="card">
          <h2>Actions</h2>
          <div class="actions">
            <button id="btnTravel">Travel to objective</button>
            <button id="btnOkada">Okada (₦500)</button>
            <button id="btnEat">Street food (₦800)</button>
            <button id="btnDeposit">Deposit ₦5,000</button>
            <button id="btnWithdraw">Withdraw ₦2,000</button>
            <button id="btnTime">Advance 3 hours</button>
          </div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
        </section>
        <section class="card">
          <h2>Ledger</h2>
          <ul class="ledger" id="ledger"></ul>
        </section>
        <section class="card row">
          <button id="btnSave">Save</button>
          <button id="btnLoad">Load</button>
          <button id="btnReset" class="danger">New game</button>
        </section>
      </aside>
      <main class="map-panel">
        <div id="map"></div>
        <div class="map-hint">Missions use Benin-area points · OSM map · systems prototype</div>
      </main>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
